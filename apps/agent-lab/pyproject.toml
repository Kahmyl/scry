[project]
name = "scry-agent-lab"
version = "0.1.0"
description = "Black-box external-agent simulator for Scry MCP qualification and experiments."
requires-python = ">=3.12"
dependencies = [
  "httpx2>=2.9,<3",
  "mcp==2.0.0",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
scry-agent-lab = "scry_agent_lab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scry_agent_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: Scry fast qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Format, types, baseline boundaries, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workflow commands exist
        run: pnpm run verify:workflow-manifests

      - name: Verify formatting
        run: pnpm run format:check

      - name: Typecheck workspaces
        run: pnpm run typecheck

      - name: Run baseline architecture, security, and deployment gates
        run: |
          pnpm run verify:baseline-topology
          pnpm run verify:boundary-ownership
          pnpm run verify:boundary-runtime
          pnpm run verify:docker-publish-workflow
          pnpm run verify:server-deployment
          pnpm run verify:deployment-runtime
          pnpm run verify:deployment-tiers
          pnpm run verify:production-operations
          pnpm run verify:deployment-preflight
          pnpm --filter @scry/api exec vitest run test/auth.service.test.ts
          pnpm --filter @scry/veil test
          pnpm --filter @scry/browser-runtime test

      - name: Run baseline tests and build
        run: |
          pnpm test
          pnpm build

name: Scry fast qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows:
    name: Windows desktop installer compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scry/web exec vitest run scripts/desktop-installer.test.mjs scripts/build-plugins.test.mjs

  fast:
    name: Format, types, baseline boundaries, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Qualify the baseline through Assurance
        run: pnpm qualify ci-fast

      - name: Verify Supabase activity checks
        run: pnpm test:auth-activity

      - name: Verify private OAuth key generation
        run: node --test scripts/operations/generate-oauth-keys.test.mjs

      - name: Retain safe qualification outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance/
          if-no-files-found: warn
          retention-days: 14

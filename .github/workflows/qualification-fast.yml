name: Scry fast qualification lane

on:
  workflow_call:
    inputs:
      base_sha:
        description: Git base used by impact-aware verification
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Format, types, boundaries, and affected tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workflow commands exist
        run: pnpm run verify:workflow-manifests

      - name: Verify formatting
        run: pnpm run format:check

      - name: Typecheck workspaces
        run: pnpm run typecheck

      - name: Run static architecture and release gates
        run: |
          pnpm run verify:repository-topology
          pnpm run verify:subsystem-boundaries
          pnpm run verify:execution-kernel-boundary
          pnpm run verify:direct-browser-boundary
          pnpm run verify:release-fingerprint
          pnpm run verify:docker-publish-workflow
          pnpm run verify:server-deployment
          pnpm run verify:deployment-runtime
          pnpm run verify:browser-v2-cutover

      - name: Run deterministic impact-aware qualification
        env:
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          base_sha="$REQUESTED_BASE_SHA"
          if [ -z "$base_sha" ] || printf '%s' "$base_sha" | grep -Eq '^0+$'; then
            base_sha=HEAD^
          fi
          pnpm run verify -- --base "$base_sha" --plan
          pnpm run verify:ci-unit

      - name: Upload impact plan and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affected-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification-affected-*.json
            artifacts/verification-ci-unit-results.json
          if-no-files-found: warn

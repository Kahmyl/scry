name: Scry browser qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser execution production-baseline qualification
    runs-on: ubuntu-latest
    env:
      SCRY_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact Playwright revision
        run: pnpm run verify:playwright

      - name: Install the pinned Chromium runtime
        run: pnpm --filter @scry/praxis exec playwright install --with-deps chromium

      - name: Select bounded runner-aware concurrency
        run: |
          workers="$(node -e 'const os=require("node:os"); process.stdout.write(String(Math.max(1,Math.min(2,os.availableParallelism()-1))))')"
          echo "BROWSER_WORKERS=$workers" >> "$GITHUB_ENV"

      - name: Qualify browser runtime and recording protection
        env:
          SCRY_BROWSER_E2E: "1"
        run: |
          pnpm --filter @scry/veil test
          pnpm --filter @scry/praxis run test

      - name: Qualify browser contracts and MCP surface
        run: >-
          pnpm --filter @scry/contracts exec vitest run
          test/browser-execution.test.ts
          --maxWorkers=$BROWSER_WORKERS

      - name: Qualify browser MCP tools
        run: >-
          pnpm --filter @scry/mcp exec vitest run
          test/server.test.ts
          --maxWorkers=$BROWSER_WORKERS

      - name: Build and qualify the customer dashboard
        run: >-
          pnpm --filter @scry/web build &&
          pnpm --filter @scry/web exec vitest run
          src/app/Dashboard.test.tsx
          --maxWorkers=1

      - name: Qualify API schema, key custody, and browser boundary
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/browser-schema-migration.test.ts
          test/browser-exception.filter.test.ts
          --maxWorkers=1

      - name: Verify baseline topology
        run: |
          pnpm verify:baseline-topology
          pnpm verify:boundary-ownership

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

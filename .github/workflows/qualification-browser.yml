name: Scry browser qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser execution production-baseline qualification
    runs-on: ubuntu-latest
    env:
      SCRY_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium runtime
        run: pnpm --filter @scry/praxis exec playwright install --with-deps chromium

      - name: Qualify browser execution and protected recording
        run: pnpm qualify browser

      - name: Retain safe qualification outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

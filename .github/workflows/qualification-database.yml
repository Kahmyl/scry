name: Scry database qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Fresh migration and database-backed lifecycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scry_ci
          POSTGRES_USER: scry
          POSTGRES_PASSWORD: scry-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scry -d scry_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BROWSER_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BROWSER_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BROWSER_EXPECTED_DATABASE: scry_ci
      SCRY_BROWSER_SCHEMA_CONFIRM: CREATE_EMPTY_BASELINE
      SCRY_BROWSER_PROTECTED_KEY_BASE64: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      SCRY_BROWSER_PROTECTED_KEY_ID: browser-key-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply fresh migration
        run: pnpm run db:migrate

      - name: Prove migration second-run idempotence
        run: pnpm run db:migrate

      - name: Verify migration, key custody, and safe error contracts
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/browser-schema-migration.test.ts
          test/browser-protected-keyring.test.ts
          test/browser-exception.filter.test.ts
          --maxWorkers=1

      - name: Verify browser lifecycle, failure truth, authorization, and scope integrity
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/browser-execution.repository.integration.test.ts
          test/browser-execution.process-failure.integration.test.ts
          test/browser-lifecycle.repository.integration.test.ts
          test/browser-auth-scope.integration.test.ts
          test/browser-scope-integrity.integration.test.ts
          --maxWorkers=1

      - name: Verify baseline topology
        run: |
          pnpm verify:baseline-topology
          pnpm verify:boundary-ownership

      - name: Upload database failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

name: Scry database qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Fresh migration and database-backed lifecycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scry_ci
          POSTGRES_USER: scry
          POSTGRES_PASSWORD: scry-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scry -d scry_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_AUTHORING_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_ORCHESTRATION_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BINDING_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_CREDENTIAL_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Record exact schema identity
        run: echo "SCRY_SCHEMA_FINGERPRINT=$(pnpm --silent schema:fingerprint)" >> "$GITHUB_ENV"

      - name: Apply fresh migration
        run: pnpm run db:migrate

      - name: Prove migration second-run idempotence
        run: pnpm run db:migrate

      - name: Verify migration lineage contracts
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/migration-fingerprint-compatibility.test.ts
          test/mission-recording-selection-migration.test.ts
          test/migration-manifest.test.ts
          test/document-transition-gap-migration-authority.test.ts
          --maxWorkers=1

      - name: Verify protected-operation persistence and server deadlines
        env:
          DATABASE_STATEMENT_TIMEOUT_MS: "250"
          DATABASE_LOCK_TIMEOUT_MS: "100"
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/protected-operation.repository.integration.test.ts
          --maxWorkers=1

      - name: Verify authoring and orchestration persistence
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/authoring.integration.test.ts
          test/adaptive-session.repository.integration.test.ts
          test/execution-kernel.repository.integration.test.ts
          test/orchestration.integration.test.ts
          test/praxis.integration.test.ts
          test/external-resource-binding.integration.test.ts
          test/project-credential-scope.integration.test.ts
          --maxWorkers=1

      - name: Classify historical M1 qualification outcome
        run: |
          set +e
          output="$(node scripts/verify-m1-preflight.mjs --migration-only)"
          status=$?
          set -e
          printf '%s\n' "$output"
          QUALIFICATION_OUTPUT="$output" QUALIFICATION_STATUS="$status" node --input-type=module <<'NODE'
          const status = Number(process.env.QUALIFICATION_STATUS);
          const lines = process.env.QUALIFICATION_OUTPUT.trim().split(/\r?\n/);
          const report = JSON.parse(lines.at(-1));
          const passed = status === 0 && report.verdict === "pass";
          const truthfullyUnavailable =
            status !== 0 &&
            report.verdict === "blocked" &&
            report.reasonCode === "M1_SNAPSHOT_REQUIRED";
          if (!passed && !truthfullyUnavailable) {
            console.error("M1 qualification neither passed nor reported the exact admitted unavailable state.");
            process.exit(1);
          }
          NODE

      - name: Upload database failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

name: Scry database qualification lane

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Fresh migration and database-backed lifecycle
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scry_ci
          POSTGRES_USER: scry
          POSTGRES_PASSWORD: scry-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scry -d scry_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BROWSER_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BROWSER_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci
      SCRY_BROWSER_EXPECTED_DATABASE: scry_ci
      SCRY_BROWSER_SCHEMA_CONFIRM: CREATE_EMPTY_BASELINE
      SCRY_BROWSER_ALLOW_DATABASE_CREATION: "1"
      SCRY_BROWSER_PROTECTED_KEY_BASE64: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      SCRY_BROWSER_PROTECTED_KEY_ID: browser-key-1
      REDIS_URL: redis://127.0.0.1:6379
      SCRY_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply fresh migration
        run: pnpm run db:migrate

      - name: Prove migration second-run idempotence
        run: pnpm run db:migrate

      - name: Verify isolated OAuth upgrade and connection lifecycle
        env:
          SCRY_OAUTH_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/postgres
        run: pnpm --filter @scry/api test test/oauth-connections.integration.test.ts --reporter=verbose

      - name: Qualify database lifecycle and safe failure contracts
        id: database_qualification
        run: pnpm qualify database

      # This suite creates only random disposable scry_migration_* databases
      # against the job's fictional Postgres service. No provider/customer
      # credentials are present. Keep the original failed gate failed: this
      # direct repeat exposes its case/error instead of losing it in counters.
      - name: Diagnose a failed disposable migration qualification
        if: failure() && steps.database_qualification.outcome == 'failure'
        run: >-
          pnpm --filter @scry/api exec vitest run
          test/baseline-migration.integration.test.ts --maxWorkers=1 --reporter=verbose

      - name: Install Chromium for the durable-worker protection regression
        run: node packages/praxis/node_modules/playwright/cli.js install --with-deps chromium

      - name: Create isolated worker qualification database
        run: >-
          pnpm --filter @scry/api exec node --input-type=module --eval
          'import pg from "pg"; const client = new pg.Client({ connectionString: process.env.DATABASE_URL }); await client.connect(); try { await client.query("CREATE DATABASE scry_ci_worker"); await client.query("CREATE DATABASE scry_ci_owner"); } finally { await client.end(); }'

      - name: Qualify the durable worker and protected observations
        env:
          DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci_worker
          SCRY_BROWSER_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci_worker
          SCRY_BROWSER_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci_worker
          SCRY_BROWSER_EXPECTED_DATABASE: scry_ci_worker
          SCRY_BROWSER_E2E: "1"
          SCRY_BROWSER_QUEUE_NAMESPACE: ci-protected-worker
        run: |
          pnpm db:migrate
          pnpm qualify worker

      - name: Qualify live owner replacement and evidence admission
        env:
          DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci_owner
          SCRY_BROWSER_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci_owner
          SCRY_BROWSER_TEST_DATABASE_URL: postgres://scry:scry-ci@127.0.0.1:5432/scry_ci_owner
          SCRY_BROWSER_EXPECTED_DATABASE: scry_ci_owner
          SCRY_BROWSER_E2E: "1"
        run: |
          pnpm db:migrate
          pnpm qualify owner

      - name: Retain safe qualification outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload database failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

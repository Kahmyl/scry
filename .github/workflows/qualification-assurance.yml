name: Scry Assurance experiments

on:
  schedule:
    - cron: "17 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    name: Non-admission experimental qualification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Assurance truth and experiment contracts
        run: pnpm run verify:assurance

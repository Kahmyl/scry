name: Publish Scry beta to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: kahmyl/scry
  STACK_IMAGE: kahmyl/scry-stack
  SCRY_DEPLOYMENT_TIER: beta
  COMPOSE_PROFILES: ""
  POSTGRES_ARCHIVE_MODE: off
  SCRY_BROWSER_CHANNEL: chromium

jobs:
  publish:
    name: Qualify and publish beta application and stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify beta contracts and implementation
        run: |
          pnpm install --frozen-lockfile
          pnpm verify:docker-publish-workflow
          pnpm format:check
          pnpm verify:privacy-foundation
          pnpm verify:playwright
          pnpm verify:subsystem-boundaries
          pnpm verify:repository-topology
          pnpm verify:execution-kernel-boundary
          pnpm verify:direct-browser-boundary
          pnpm verify:protected-interaction-conformance
          pnpm verify:release-fingerprint
          pnpm verify:deployment-tiers
          pnpm typecheck
          pnpm test:beta
          echo "SCRY_SCHEMA_FINGERPRINT=$(node scripts/schema-fingerprint.mjs)" >> "$GITHUB_ENV"

      - name: Verify authoring release against an isolated database
        env:
          SCRY_AUTHORING_TEST_DATABASE_URL: postgres://scry:scry-local@127.0.0.1:54329/scry
        run: |
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose up -d --wait postgres
          DATABASE_URL="$SCRY_AUTHORING_TEST_DATABASE_URL" pnpm db:migrate
          pnpm verify:adaptive-authoring-release

      - name: Generate application image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the combined Scry image for qualification
        id: qualification-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: scry-beta-ci:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.scry.privacy-authority=veil-only
            org.scry.schema-fingerprint=${{ env.SCRY_SCHEMA_FINGERPRINT }}
            org.scry.release-id=${{ github.sha }}
          cache-from: type=gha,scope=scry

      - name: Boot and verify the candidate beta topology
        env:
          SCRY_DOMAIN: scry.example.com
          POSTGRES_PASSWORD: integration-password
          SCRY_SERVICE_TOKEN: integration-service-token
          SCRY_CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          VEIL_ADMISSION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: integration-placeholder
          SCRY_IMAGE_REF: scry-beta-ci:${{ github.sha }}
          SCRY_RELEASE_ID: ${{ github.sha }}
        run: |
          trap 'docker compose -f compose.deploy.yml down -v' EXIT
          docker compose -f compose.deploy.yml up -d --wait postgres redis migrate api worker mcp web
          docker compose -f compose.deploy.yml exec -T api wget -qO- http://127.0.0.1:4000/api/ready
          docker compose -f compose.deploy.yml exec -T mcp wget -qO- http://127.0.0.1:4100/health
          docker compose -f compose.deploy.yml exec -T web wget -qO- http://127.0.0.1:3000/
          test -z "$(docker compose -f compose.deploy.yml ps --services --filter status=running | grep -E 'backup|restore-drill|prometheus|alertmanager' || true)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the qualified Scry image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.scry.privacy-authority=veil-only
            org.scry.schema-fingerprint=${{ env.SCRY_SCHEMA_FINGERPRINT }}
            org.scry.release-id=${{ github.sha }}
          cache-from: type=gha,scope=scry
          cache-to: type=gha,mode=max,scope=scry

      - name: Select stack tag
        id: stack
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Require OCI-capable Docker Compose
        shell: bash
        run: |
          compose_version="$(docker compose version --short)"
          printf 'Docker Compose %s\n' "$compose_version"
          minimum="2.34.0"
          if [ "$(printf '%s\n' "$minimum" "$compose_version" | sort -V | head -n1)" != "$minimum" ]; then
            echo "Docker Compose 2.34.0 or later is required to publish OCI artifacts."
            exit 1
          fi

      - name: Publish the beta Compose application as an OCI artifact
        env:
          SCRY_DOMAIN: scry.example.com
          POSTGRES_PASSWORD: publish-placeholder
          SCRY_SERVICE_TOKEN: publish-placeholder
          SCRY_CREDENTIAL_ENCRYPTION_KEY: publish-placeholder
          VEIL_ADMISSION_KEY: publish-placeholder-at-least-32-bytes
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: publish-placeholder
          SCRY_IMAGE_REF: ${{ env.APP_IMAGE }}@${{ steps.build.outputs.digest }}
          SCRY_RELEASE_ID: ${{ github.sha }}
        run: |
          docker compose -f compose.deploy.yml publish -y \
            "${STACK_IMAGE}:${{ steps.stack.outputs.tag }}"

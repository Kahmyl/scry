name: scry

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgres://scry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${SCRY_DATABASE_NAME:?Set SCRY_DATABASE_NAME to the existing database}
  REDIS_URL: redis://redis:6379
  SCRY_BROWSER_ARTIFACT_ROOT: /workspace/apps/api/artifacts/browser
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
  SCRY_SERVICE_TOKEN: ${SCRY_SERVICE_TOKEN:?Set SCRY_SERVICE_TOKEN}
  SCRY_BROWSER_ENABLED: "true"
  SCRY_BROWSER_RENDER_VIDEO: "true"
  SCRY_BROWSER_MAX_LIVE_SESSIONS: ${SCRY_BROWSER_MAX_LIVE_SESSIONS:-1}
  SCRY_BROWSER_REQUIRE_ACTIVATED_CUTOVER: ${SCRY_BROWSER_REQUIRE_ACTIVATED_CUTOVER:-true}
  SCRY_BROWSER_PROTECTED_KEYS_JSON: ${SCRY_BROWSER_PROTECTED_KEYS_JSON:?Load the browser keyring from the production secret manager}
  SCRY_BROWSER_PROTECTED_KEY_ID: ${SCRY_BROWSER_PROTECTED_KEY_ID:?Set the active browser key ID}

x-backup-environment: &backup-environment
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
  AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-}
  AWS_ENDPOINT: ${BACKUP_AWS_ENDPOINT:-}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  PGHOST: postgres
  PGUSER: scry
  BACKUP_KEEP_HOURLY: ${BACKUP_KEEP_HOURLY:-48}
  BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
  BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-12}
  BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
  RESTORE_DRILL_RTO_SECONDS: ${RESTORE_DRILL_RTO_SECONDS:-3600}

services:
  supabase-activity:
    profiles: [auth-activity]
    image: ${SCRY_IMAGE_REF:?Set SCRY_IMAGE_REF to an immutable image digest}
    command: ["node", "scripts/operations/supabase-activity.mjs", "--watch"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "scripts/operations/supabase-activity.mjs", "--health"]
      interval: 1m
      timeout: 5s
      retries: 1
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SCRY_DOMAIN: ${SCRY_DOMAIN:?Set SCRY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: ${SCRY_IMAGE_REF:?Set SCRY_IMAGE_REF to an immutable image digest}
    restart: unless-stopped
    command: ["node", "apps/web/scripts/serve-dist.mjs"]
    environment:
      WEB_PORT: "3000"
      SCRY_PUBLIC_API_BASE_URL: /api
      SCRY_PUBLIC_MCP_SERVER_URL: /mcp
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      SCRY_RELEASE_ID: ${SCRY_RELEASE_ID:?Set SCRY_RELEASE_ID}
    depends_on:
      api:
        condition: service_started
      mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${SCRY_IMAGE_REF:?Set SCRY_IMAGE_REF to an immutable image digest}
    restart: unless-stopped
    environment:
      <<: *api-environment
      SCRY_TEST_MAIL_ENABLED: ${SCRY_TEST_MAIL_ENABLED:-false}
      HOOKDECK_API_KEY: ${HOOKDECK_API_KEY:-}
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      API_CORS_ORIGINS: https://${SCRY_DOMAIN:?Set SCRY_DOMAIN}
      SCRY_RELEASE_ID: ${SCRY_RELEASE_ID:?Set SCRY_RELEASE_ID}
    command:
      [
        "apps/api/node_modules/.bin/tsx",
        "--tsconfig",
        "apps/api/tsconfig.json",
        "apps/api/src/main.ts",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/workspace/apps/api/artifacts/browser
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      start_period: 20s
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: ${SCRY_IMAGE_REF:?Set SCRY_IMAGE_REF to an immutable image digest}
    restart: unless-stopped
    command:
      [
        "apps/api/node_modules/.bin/tsx",
        "--tsconfig",
        "apps/api/tsconfig.json",
        "apps/api/src/worker.ts",
      ]
    environment:
      <<: *api-environment
      SCRY_BROWSER_CHANNEL: chromium
      SCRY_BROWSER_SESSION_CONCURRENCY: ${SCRY_WORKER_CONCURRENCY:-4}
      SCRY_BROWSER_COMMAND_CONCURRENCY: ${SCRY_COMMAND_CONCURRENCY:-8}
      SCRY_RELEASE_ID: ${SCRY_RELEASE_ID:?Set SCRY_RELEASE_ID}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/workspace/apps/api/artifacts/browser
    shm_size: 1gb
    stop_grace_period: 60s

  migrate:
    image: ${SCRY_IMAGE_REF:?Set SCRY_IMAGE_REF to an immutable image digest}
    restart: "no"
    command:
      [
        "apps/api/node_modules/.bin/tsx",
        "--tsconfig",
        "apps/api/tsconfig.json",
        "apps/api/scripts/migrate.ts",
      ]
    environment:
      SCRY_BROWSER_DATABASE_URL: postgres://scry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${SCRY_DATABASE_NAME:?Set SCRY_DATABASE_NAME to the existing database}
      SCRY_BROWSER_EXPECTED_DATABASE: ${SCRY_DATABASE_NAME:?Set SCRY_DATABASE_NAME to the existing database}
      SCRY_BROWSER_SCHEMA_CONFIRM: CREATE_EMPTY_BASELINE
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    image: ${SCRY_IMAGE_REF:?Set SCRY_IMAGE_REF to an immutable image digest}
    restart: unless-stopped
    command:
      [
        "apps/mcp/node_modules/.bin/tsx",
        "--tsconfig",
        "apps/mcp/tsconfig.json",
        "apps/mcp/src/http.ts",
      ]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "4100"
      MCP_ALLOWED_ORIGINS: https://${SCRY_DOMAIN:?Set SCRY_DOMAIN}
      SCRY_API_BASE_URL: http://api:4000/api
      SCRY_PUBLIC_API_BASE_URL: https://${SCRY_DOMAIN:?Set SCRY_DOMAIN}/api
      SCRY_SERVICE_TOKEN: ${SCRY_SERVICE_TOKEN:?Set SCRY_SERVICE_TOKEN}
      SCRY_RELEASE_ID: ${SCRY_RELEASE_ID:?Set SCRY_RELEASE_ID}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      start_period: 20s
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SCRY_DATABASE_NAME:?Set SCRY_DATABASE_NAME to the existing database}
      POSTGRES_USER: scry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/wal-archive
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300s}
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_command=test -f /wal-archive/%f || (cp %p /wal-archive/.%f.tmp && chmod 0600 /wal-archive/.%f.tmp && mv /wal-archive/.%f.tmp /wal-archive/%f)
    configs:
      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U scry -d ${SCRY_DATABASE_NAME:?Set SCRY_DATABASE_NAME to the existing database}",
        ]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres-storage-init:
        condition: service_completed_successfully

  postgres-storage-init:
    image: postgres:17-alpine
    restart: "no"
    user: root
    command: ["sh", "-c", "chown -R postgres:postgres /wal-archive && chmod 0700 /wal-archive"]
    volumes:
      - postgres_wal_archive:/wal-archive

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-base-backup:
    profiles: [operations]
    image: ${SCRY_BACKUP_IMAGE_REF:-scry-backup:local}
    restart: unless-stopped
    command: ["postgres-base"]
    environment:
      <<: *backup-environment
      POSTGRES_BASE_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BASE_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backup_staging:/staging
      - backup_metrics:/metrics
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres-wal-backup:
    profiles: [operations]
    image: ${SCRY_BACKUP_IMAGE_REF:-scry-backup:local}
    restart: unless-stopped
    command: ["postgres-wal"]
    environment:
      <<: *backup-environment
      POSTGRES_WAL_BACKUP_INTERVAL_SECONDS: ${POSTGRES_WAL_BACKUP_INTERVAL_SECONDS:-300}
    volumes:
      - postgres_wal_archive:/wal-archive:ro
      - backup_metrics:/metrics
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  artifact-backup:
    profiles: [operations]
    image: ${SCRY_BACKUP_IMAGE_REF:-scry-backup:local}
    restart: unless-stopped
    command: ["artifacts"]
    environment:
      <<: *backup-environment
      ARTIFACT_BACKUP_INTERVAL_SECONDS: ${ARTIFACT_BACKUP_INTERVAL_SECONDS:-900}
    volumes:
      - artifacts:/artifacts:ro
      - backup_metrics:/metrics
    depends_on:
      backup-init:
        condition: service_completed_successfully

  backup-maintenance:
    profiles: [operations]
    image: ${SCRY_BACKUP_IMAGE_REF:-scry-backup:local}
    restart: unless-stopped
    command: ["maintenance"]
    environment:
      <<: *backup-environment
      BACKUP_MAINTENANCE_INTERVAL_SECONDS: ${BACKUP_MAINTENANCE_INTERVAL_SECONDS:-86400}
      BACKUP_CHECK_DATA_SUBSET: ${BACKUP_CHECK_DATA_SUBSET:-5%}
    volumes:
      - backup_metrics:/metrics
    depends_on:
      backup-init:
        condition: service_completed_successfully

  restore-drill:
    profiles: [operations]
    image: ${SCRY_BACKUP_IMAGE_REF:-scry-backup:local}
    restart: unless-stopped
    command: ["restore-drill"]
    environment:
      <<: *backup-environment
      RESTORE_DRILL_INTERVAL_SECONDS: ${RESTORE_DRILL_INTERVAL_SECONDS:-604800}
    volumes:
      - restore_drill:/restore-drill
      - backup_metrics:/metrics
    depends_on:
      backup-init:
        condition: service_completed_successfully

  backup-init:
    profiles: [operations]
    image: ${SCRY_BACKUP_IMAGE_REF:-scry-backup:local}
    restart: "no"
    command: ["init"]
    environment:
      <<: *backup-environment

  postgres-exporter:
    profiles: [operations]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://scry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${SCRY_DATABASE_NAME:?Set SCRY_DATABASE_NAME to the existing database}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    profiles: [operations]
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  blackbox-exporter:
    profiles: [operations]
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    configs:
      - source: blackbox_config
        target: /etc/blackbox/blackbox.yml

  backup-metrics:
    profiles: [operations]
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      [
        "--collector.disable-defaults",
        "--collector.textfile",
        "--collector.textfile.directory=/metrics",
      ]
    volumes:
      - backup_metrics:/metrics:ro

  alertmanager:
    profiles: [operations]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager_data:/alertmanager

  prometheus:
    profiles: [operations]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=30d",
      ]
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/rules.yml
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - postgres-exporter
      - redis-exporter
      - blackbox-exporter
      - backup-metrics

volumes:
  postgres_data:
  redis_data:
  artifacts:
  postgres_wal_archive:
  backup_staging:
  backup_metrics:
  restore_drill:
  prometheus_data:
  alertmanager_data:
  caddy_data:
  caddy_config:

configs:
  postgres_hba:
    file: ./ops/postgres/pg_hba.conf
  prometheus_config:
    file: ./ops/observability/prometheus.yml
  prometheus_rules:
    file: ./ops/observability/rules.yml
  blackbox_config:
    file: ./ops/observability/blackbox.yml
  alertmanager_config:
    content: |
      route:
        receiver: operations
        group_by: [alertname, severity]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: operations
          webhook_configs:
            - url: ${SCRY_ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/operations-disabled}
              send_resolved: true
  caddyfile:
    content: |
      ${SCRY_DOMAIN:?Set SCRY_DOMAIN} {
        handle /api/* {
          reverse_proxy api:4000
        }
        handle /mcp {
          reverse_proxy mcp:4100
        }
        handle {
          reverse_proxy web:3000
        }
        encode zstd gzip
      }

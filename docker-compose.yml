name: scry

x-app-environment: &app-environment
  DATABASE_URL: "${DATABASE_URL:-postgres://scry:scry-local@postgres:5432/scry_browser}"
  REDIS_URL: redis://redis:6379
  # Local-development service identity shared by API, worker, MCP, and campaigns.
  SCRY_SERVICE_TOKEN: "${SCRY_SERVICE_TOKEN:-local-only-scry-service-token-change-me}"
  SCRY_BROWSER_ARTIFACT_ROOT: /workspace/apps/api/artifacts/browser
  SCRY_BROWSER_ENABLED: "true"
  SCRY_BROWSER_RENDER_VIDEO: "true"
  SCRY_BROWSER_PROTECTED_KEYS_JSON: '${SCRY_BROWSER_PROTECTED_KEYS_JSON:-{"local-v1":"MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="}}'
  SCRY_BROWSER_PROTECTED_KEY_ID: "${SCRY_BROWSER_PROTECTED_KEY_ID:-local-v1}"

x-release-environment: &release-environment
  SCRY_RELEASE_ID: "${SCRY_RELEASE_ID:-local-baseline}"

x-node-build: &node-build
  context: .
  dockerfile: docker/Dockerfile.dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scry_browser
      POSTGRES_USER: scry
      POSTGRES_PASSWORD: scry-local
    ports:
      - "${SCRY_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scry -d scry_browser"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - scry-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    init: true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${SCRY_REDIS_PORT:-56389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - scry-redis:/data
    restart: unless-stopped
    init: true

  migrate:
    build: *node-build
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      <<: [*app-environment, *release-environment]
      SCRY_BROWSER_DATABASE_URL: "${DATABASE_URL:-postgres://scry:scry-local@postgres:5432/scry_browser}"
      SCRY_BROWSER_EXPECTED_DATABASE: scry_browser
      SCRY_BROWSER_SCHEMA_CONFIRM: CREATE_EMPTY_BASELINE
    command: ["pnpm", "--filter", "@scry/api", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      <<: [*app-environment, *release-environment]
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SCRY_BROWSER_CHANNEL: chromium
    command: ["pnpm", "--filter", "@scry/api", "dev"]
    ports:
      - "${SCRY_API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - scry-artifacts:/workspace/apps/api/artifacts/browser
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    develop:
      watch:
        - action: sync
          path: apps/api/src
          target: /workspace/apps/api/src
        - action: sync
          path: apps/api/scripts
          target: /workspace/apps/api/scripts
        - action: sync
          path: packages/contracts/src
          target: /workspace/packages/contracts/src
        - action: sync
          path: packages/praxis/src
          target: /workspace/packages/praxis/src
        - action: sync
          path: packages/veil/src
          target: /workspace/packages/veil/src
        - action: sync
          path: packages/chronicle/src
          target: /workspace/packages/chronicle/src
        - action: rebuild
          path: apps/api/package.json
        - action: rebuild
          path: packages/chronicle/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      <<: [*app-environment, *release-environment]
      SCRY_BROWSER_CHANNEL: chromium
      SCRY_BROWSER_SESSION_CONCURRENCY: "${SCRY_WORKER_CONCURRENCY:-4}"
      SCRY_BROWSER_COMMAND_CONCURRENCY: "${SCRY_COMMAND_CONCURRENCY:-8}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - scry-artifacts:/workspace/apps/api/artifacts/browser
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    shm_size: 1gb
    develop:
      watch:
        - action: sync+restart
          path: apps/api/src
          target: /workspace/apps/api/src
        - action: sync+restart
          path: packages/praxis/src
          target: /workspace/packages/praxis/src
        - action: sync+restart
          path: packages/veil/src
          target: /workspace/packages/veil/src
        - action: sync+restart
          path: packages/chronicle/src
          target: /workspace/packages/chronicle/src
        - action: sync+restart
          path: packages/contracts/src
          target: /workspace/packages/contracts/src
        - action: rebuild
          path: apps/api/package.json
        - action: rebuild
          path: packages/praxis/package.json
        - action: rebuild
          path: packages/veil/package.json
        - action: rebuild
          path: packages/chronicle/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  mcp:
    build: *node-build
    environment:
      <<: *release-environment
      SCRY_SERVICE_TOKEN: "${SCRY_SERVICE_TOKEN:-local-only-scry-service-token-change-me}"
      SCRY_API_BASE_URL: http://api:4000/api
      SCRY_PUBLIC_API_BASE_URL: "${SCRY_PUBLIC_API_BASE_URL:-http://127.0.0.1:4000/api}"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 4100
    command: ["pnpm", "--filter", "@scry/mcp", "start:http"]
    ports:
      - "${SCRY_MCP_PORT:-4100}:4100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    develop:
      watch:
        - action: sync+restart
          path: apps/mcp/src
          target: /workspace/apps/mcp/src
        - action: rebuild
          path: apps/mcp/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  web:
    build: *node-build
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:4000
      VITE_MCP_SERVER_URL: http://127.0.0.1:${SCRY_MCP_PORT:-4100}/mcp
    command: ["pnpm", "--filter", "@scry/web", "dev:docker"]
    ports:
      - "${SCRY_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    develop:
      watch:
        - action: sync
          path: apps/web/src
          target: /workspace/apps/web/src
        - action: sync
          path: apps/web/index.html
          target: /workspace/apps/web/index.html
        - action: sync
          path: apps/web/vite.config.ts
          target: /workspace/apps/web/vite.config.ts
        - action: rebuild
          path: apps/web/package.json
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  scry-postgres:
  scry-redis:
  scry-artifacts:
